; Reference only. Initialize security before starting:
; supervisord init --output supervisor.ini
; supervisord -n -c supervisor.ini
; The generated password hash, certificate and private key are kept in this file.

[supervisord]
identifier = supervisor
logfile = %(here)s/supervisord.log
logfile_maxbytes = 50MB
logfile_backups = 5
logfile_timestamp_suffix = false
loglevel = info
pidfile = %(here)s/supervisord.pid

[inet_http_server]
port = 0.0.0.0:8002

[supervisorctl]
serverurl = https://localhost:8002

; Uncomment only after replacing paths with your installed application.
; [program:my-app]
; directory = %(here)s/apps/my-app
; command = ./my-app --name "hello world" --label 'single quotes'
; autostart = true
; autorestart = unexpected
; stopsignal = TERM
; stopwaitsecs = 10
; stopasgroup = true
; killasgroup = true
; stdout_logfile = logs/stdout.log
; stderr_logfile = logs/stderr.log
; stdout_logfile_timestamp_suffix = false
; stderr_logfile_timestamp_suffix = false
; stdout_logfile_maxbytes = 50MB
; stderr_logfile_maxbytes = 50MB
; stdout_logfile_backups = 5
; stderr_logfile_backups = 5

; [include]
; files = conf.d/*.conf
